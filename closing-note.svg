<svg width="1200" height="285" viewBox="0 0 1200 285" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open to collaboration</title><desc id="desc">A bold animated editorial call to collaborate on data systems.</desc>
  <defs><pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#111111" fill-opacity=".06"/></pattern><clipPath id="clip"><rect x="1" y="1" width="1198" height="283" rx="26"/></clipPath></defs>
  <rect x="1" y="1" width="1198" height="283" rx="26" fill="#FF5A1F" stroke="#111111" stroke-width="2"/>
  <g clip-path="url(#clip)"><rect width="1200" height="285" fill="url(#stripe)"/><rect x="850" y="0" width="350" height="285" fill="#315CFF"/>
    <text x="48" y="52" fill="#431304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3">04 / OPEN CHANNEL</text>
    <text x="48" y="116" fill="#111111" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="900">LET’S MAKE DATA</text>
    <text x="48" y="164" fill="#F5F0E6" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="900">MOVE WITH PURPOSE.</text>
    <text x="48" y="205" fill="#3F190C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Open to data engineering, analytics, MERN and infrastructure collaborations.</text>
    <path d="M48 237H748" stroke="#111111" stroke-width="3"/><circle cx="48" cy="237" r="7" fill="#C7FF2E"><animate attributeName="cx" values="48;748;48" dur="6s" repeatCount="indefinite"/></circle>

    <g transform="translate(1025 142)">
      <circle r="88" fill="#111111"/>
      <circle r="60" stroke="#F5F0E6" stroke-width="2" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/></circle>
      <path d="M-31 6L-8 29 36-27" stroke="#C7FF2E" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>
    <text x="1025" y="264" fill="#DDE4FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" letter-spacing="2">SIGNAL RECEIVED</text>
  </g>
</svg>
