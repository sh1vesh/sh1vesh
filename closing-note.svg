<svg width="1200" height="285" viewBox="0 0 1200 285" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open to collaboration</title><desc id="desc">A bold animated editorial call to collaborate on data systems.</desc>
  <defs><pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#111111" fill-opacity=".055"/></pattern><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#F5F0E6" stroke-opacity=".08"/></pattern><clipPath id="clip"><rect x="1" y="1" width="1198" height="283" rx="26"/></clipPath></defs>
  <rect x="1" y="1" width="1198" height="283" rx="26" fill="#FF5A1F" stroke="#111111" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="285" fill="url(#stripe)"/><rect x="850" width="350" height="285" fill="#315CFF"/><rect x="850" width="350" height="285" fill="url(#grid)"/><path d="M850 0V285" stroke="#111111" stroke-width="2"/>
    <text x="48" y="45" fill="#431304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="3">04 / OPEN CHANNEL</text>
    <text x="800" y="45" fill="#431304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end" letter-spacing="2">AVAILABLE FOR SELECT BUILDS</text>
    <text x="48" y="112" fill="#111111" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="900" letter-spacing="-1.5">LET’S MAKE DATA</text>
    <text x="48" y="160" fill="#F5F0E6" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="900" letter-spacing="-1.5">MOVE WITH PURPOSE.</text>
    <text x="48" y="198" fill="#3F190C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Open to data engineering, analytics, MERN and infrastructure collaborations.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.8"><text x="48" y="221" fill="#431304">DATA SYSTEMS</text><text x="181" y="221" fill="#431304">•</text><text x="201" y="221" fill="#431304">BACKEND</text><text x="285" y="221" fill="#431304">•</text><text x="305" y="221" fill="#431304">INFRASTRUCTURE</text></g>
    <path d="M48 248H748" stroke="#111111" stroke-width="3"/>
    <circle cx="48" cy="248" r="7" fill="#C7FF2E"><animate attributeName="cx" values="48;748;48" dur="6s" repeatCount="indefinite"/></circle><circle cx="748" cy="248" r="4" fill="#111111"/>
    <g transform="translate(1025 136)">
      <circle r="92" fill="#111111"/>
      <circle r="66" stroke="#F5F0E6" stroke-width="2" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/></circle>
      <circle r="49" fill="#161616"/>
      <circle r="74" stroke="#C7FF2E" stroke-width="2" opacity=".25"><animate attributeName="r" values="66;82;66" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="3s" repeatCount="indefinite"/></circle>
      <path d="M-31 5L-8 28 36-28" stroke="#C7FF2E" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="66" cy="0" r="6" fill="#FF5A1F"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/></circle>
    </g>
    <text x="1025" y="252" fill="#DDE4FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" letter-spacing="2">SIGNAL RECEIVED</text>
    <text x="1025" y="269" fill="#C7FF2E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle" letter-spacing="1.8">CHANNEL OPEN</text>
  </g>
</svg>