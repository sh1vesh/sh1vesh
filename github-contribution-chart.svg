<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1017"/>
      <stop offset="1" stop-color="#0A111B"/>
    </linearGradient>

    <linearGradient id="line" x1="95" y1="280" x2="1120" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#147DFF"/>
      <stop offset="1" stop-color="#55B7FF"/>
    </linearGradient>

    <linearGradient id="area" x1="0" y1="80" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1677FF" stop-opacity=".36"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity=".015"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="1"/>
    </pattern>

    <style>
      .title {
        font: 600 20px Inter, Arial, sans-serif;
        fill: #DCE8F8;
      }

      .sub {
        font: 500 10px Inter, Arial, sans-serif;
        fill: #788CA8;
        letter-spacing: 2px;
      }

      .axis {
        font: 500 12px Inter, Arial, sans-serif;
        fill: #6F8DB5;
      }

      .grid {
        stroke: #28405E;
        stroke-width: 1;
        stroke-dasharray: 5 7;
        opacity: .55;
      }

      .border {
        stroke: #5C5A52;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="#0B1017"/>

  <!-- Full width card -->
  <rect x="1" y="20" width="1198" height="320" rx="24" fill="url(#bg)" class="border"/>
  <rect x="1" y="20" width="1198" height="320" rx="24" fill="url(#gridPattern)"/>

  <!-- Header -->
  <text x="48" y="60" class="sub">GITHUB / CONTRIBUTION ACTIVITY</text>
  <text x="48" y="92" class="title">CONTRIBUTIONS IN THE LAST YEAR.</text>

  <!-- Filter button -->
  <rect x="1013" y="42" width="140" height="36" rx="10" fill="#0D1622" stroke="#263D5A"/>
  <text x="1034" y="64" class="axis">LAST YEAR</text>
  <path d="M1121 56L1128 63L1135 56" stroke="#8AA6C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Grid -->
  <line x1="80" y1="125" x2="1145" y2="125" class="grid"/>
  <line x1="80" y1="170" x2="1145" y2="170" class="grid"/>
  <line x1="80" y1="215" x2="1145" y2="215" class="grid"/>
  <line x1="80" y1="260" x2="1145" y2="260" class="grid"/>

  <!-- Axes -->
  <line x1="80" y1="290" x2="1145" y2="290" stroke="#314C6D" stroke-width="1.2"/>
  <line x1="80" y1="125" x2="80" y2="290" stroke="#314C6D" stroke-width="1.2"/>

  <!-- Y labels -->
  <text x="40" y="130" class="axis">60</text>
  <text x="40" y="175" class="axis">45</text>
  <text x="40" y="220" class="axis">30</text>
  <text x="40" y="265" class="axis">15</text>
  <text x="50" y="295" class="axis">0</text>

  <!-- Area -->
  <path
    d="
      M92 284
      C180 284 260 284 340 284
      C420 284 490 284 550 283
      C580 282 600 274 620 261
      C640 246 657 242 678 242
      C714 242 744 255 777 268
      C820 281 872 279 923 280
      C972 281 997 281 1015 271
      C1039 255 1059 224 1083 182
      C1105 145 1122 110 1134 94
      L1134 290
      L92 290
      Z
    "
    fill="url(#area)"
  />

  <!-- Glow -->
  <path
    d="
      M92 284
      C180 284 260 284 340 284
      C420 284 490 284 550 283
      C580 282 600 274 620 261
      C640 246 657 242 678 242
      C714 242 744 255 777 268
      C820 281 872 279 923 280
      C972 281 997 281 1015 271
      C1039 255 1059 224 1083 182
      C1105 145 1122 110 1134 94
    "
    fill="none"
    stroke="#167DFF"
    stroke-opacity=".22"
    stroke-width="12"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Main line -->
  <path
    d="
      M92 284
      C180 284 260 284 340 284
      C420 284 490 284 550 283
      C580 282 600 274 620 261
      C640 246 657 242 678 242
      C714 242 744 255 777 268
      C820 281 872 279 923 280
      C972 281 997 281 1015 271
      C1039 255 1059 224 1083 182
      C1105 145 1122 110 1134 94
    "
    fill="none"
    stroke="url(#line)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Final point -->
  <circle cx="1134" cy="94" r="14" fill="#187FFF" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="1134" cy="94" r="7" fill="#EEF7FF" filter="url(#glow)"/>
  <circle cx="1134" cy="94" r="4" fill="#64C4FF"/>

  <!-- X labels -->
  <g class="axis">
    <text x="70" y="318">25/08</text>
    <text x="244" y="318">25/10</text>
    <text x="418" y="318">25/12</text>
    <text x="592" y="318">26/02</text>
    <text x="766" y="318">26/04</text>
    <text x="940" y="318">26/06</text>
    <text x="1100" y="318">26/08</text>
  </g>

</svg>
