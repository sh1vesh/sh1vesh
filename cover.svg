<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shivesh — systems, data and infrastructure</title>
  <desc id="desc">An animated editorial-style profile cover in ivory, black, orange and cobalt.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#111111" fill-opacity=".06"/></pattern>
    <pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#F5F0E6" stroke-opacity=".12"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="478" rx="26"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="478" rx="26" fill="#F5F0E6" stroke="#111111" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="480" fill="url(#paper)"/>
    <rect x="858" width="342" height="480" fill="#FF5A1F"/>
    <rect x="858" width="342" height="480" fill="url(#lines)"/>
    <path d="M0 76H1200M0 400H1200M72 0V480M858 0V480" stroke="#111111" stroke-width="2"/>

    <text x="96" y="46" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">FIELD NOTES / VOL. 01</text>
    <text x="830" y="46" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">INDIA · 2026</text>
    <text x="1025" y="46" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="2">SYSTEMS IN MOTION</text>

    <text x="106" y="222" fill="#111111" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="122" font-weight="900" letter-spacing="-8">SHI</text>
    <text x="456" y="222" fill="#315CFF" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="122" font-weight="900" letter-spacing="-8">VESH</text>
    <rect x="108" y="246" width="574" height="7" fill="#111111"/>
    <rect x="108" y="246" width="112" height="7" fill="#FF5A1F"><animate attributeName="x" values="108;570;108" dur="5s" repeatCount="indefinite"/></rect>
    <text x="108" y="292" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">DATA ENGINEERING  /  MERN  /  PYTHON</text>
    <text x="108" y="326" fill="#565149" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">B.Tech CSE ’27 — decoding how data moves, systems scale,</text>
    <text x="108" y="350" fill="#565149" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">and reliable products are built from first principles.</text>

    <g transform="translate(1029 226)">
      <circle r="112" fill="#111111"/>
      <circle r="82" stroke="#F5F0E6" stroke-width="2" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/></circle>
      <circle r="44" fill="#C7FF2E"/>
      <path d="M-22 0H22M0-22V22" stroke="#111111" stroke-width="4"/>
      <circle cx="82" cy="0" r="8" fill="#315CFF"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/></circle>
    </g>

    <text x="36" y="246" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2" text-anchor="middle" transform="rotate(-90 36 246)">BUILD · OBSERVE · ITERATE</text>

    <rect y="400" width="1200" height="80" fill="#111111"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#F5F0E6" letter-spacing="2">
      <text x="90" y="448">CURRENTLY EXPLORING</text>
      <text x="320" y="448" fill="#C7FF2E">DATA PIPELINES</text>
      <text x="516" y="448">•</text>
      <text x="554" y="448" fill="#FF9A73">KUBERNETES</text>
      <text x="708" y="448">•</text>
      <text x="746" y="448" fill="#8BA7FF">CLOUD SYSTEMS</text>
      <text x="942" y="448">•</text>
      <text x="980" y="448">NETWORK SECURITY</text>
    </g>
    <rect x="-420" y="400" width="180" height="80" fill="#315CFF" opacity=".32"><animate attributeName="x" values="-420;1380" dur="9s" repeatCount="indefinite"/></rect>
  </g>
</svg>

