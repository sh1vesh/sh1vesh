<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Selected experiments</title>
  <desc id="desc">Two honest project notes from Shivesh's public repositories.</desc>

  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#F5F0E6" stroke-opacity=".045"/>
    </pattern>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#F5F0E6" fill-opacity=".06"/>
    </pattern>

    <clipPath id="clip">
      <rect x="1" y="1" width="1198" height="438" rx="26"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="26" fill="#111111" stroke="#F5F0E6" stroke-opacity=".45" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect width="1200" height="440" fill="url(#dots)"/>

    <text x="48" y="57" fill="#FF9A73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">
      03 / WORK INDEX
    </text>

    <text x="48" y="101" fill="#F5F0E6" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">
      SMALL EXPERIMENTS. REAL SIGNAL.
    </text>

    <text x="1152" y="96" fill="#88837A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">
      PUBLIC REPOSITORY NOTES / 2026
    </text>

    <path d="M48 124H1152" stroke="#F5F0E6" stroke-opacity=".35"/>

    <g transform="translate(48 148)">
      <text x="0" y="92" fill="#FF5A1F" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="104" font-weight="900">
        01
      </text>

      <path d="M150 0V118" stroke="#F5F0E6" stroke-opacity=".28"/>

      <text x="184" y="28" fill="#C7FF2E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">
        BACKEND EXERCISE · MERN
      </text>

      <text x="184" y="64" fill="#F5F0E6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">
        TweetFlick API
      </text>

      <text x="184" y="91" fill="#9A958B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">
        Express + MongoDB flow for publishing and loading timestamped,
      </text>

      <text x="184" y="111" fill="#9A958B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">
        140-character posts with client-side connection handling.
      </text>

      <rect x="760" y="12" width="302" height="86" fill="#181818" stroke="#315CFF" stroke-width="2"/>

      <text x="778" y="30" fill="#8BA7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5">
        ENDPOINTS
      </text>

      <text x="778" y="50" fill="#8BA7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
        GET  /api/tweets
      </text>

      <text x="778" y="72" fill="#FF9A73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
        POST /api/tweets
      </text>

      <path d="M948 28V82" stroke="#315CFF" stroke-opacity=".45"/>

      <text x="968" y="46" fill="#88837A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5">
        STATE
      </text>

      <text x="968" y="66" fill="#C7FF2E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">
        ACTIVE
      </text>

      <circle cx="1030" cy="55" r="8" fill="#C7FF2E">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1030" cy="55" r="15" stroke="#C7FF2E" opacity=".35">
        <animate attributeName="r" values="10;18;10" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".35;0;.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M48 282H1152" stroke="#F5F0E6" stroke-opacity=".24"/>

    <g transform="translate(48 300)">
      <text x="0" y="92" fill="#315CFF" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="104" font-weight="900">
        02
      </text>

      <path d="M150 0V118" stroke="#F5F0E6" stroke-opacity=".28"/>

      <text x="184" y="28" fill="#FF9A73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">
        EARLY BUILD · STOREFRONT
      </text>

      <text x="184" y="64" fill="#F5F0E6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">
        Myntra Clone
      </text>

      <text x="184" y="91" fill="#9A958B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">
        A newly initialized storefront recreation—currently a blank canvas
      </text>

      <text x="184" y="111" fill="#9A958B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">
        for product discovery, catalogue UI and commerce patterns.
      </text>

      <rect x="760" y="12" width="302" height="86" fill="#F5F0E6"/>

      <text x="778" y="32" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">
        STATUS
      </text>

      <text x="778" y="58" fill="#315CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">
        FOUNDATION / IN PROGRESS
      </text>

      <rect x="778" y="72" width="236" height="4" fill="#CCC5B8"/>

      <rect x="778" y="72" width="74" height="4" fill="#FF5A1F">
        <animate attributeName="width" values="38;120;74;38" dur="5s" repeatCount="indefinite"/>
      </rect>

      <text x="778" y="93" fill="#6C675E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.4">
        UI / CATALOG / COMMERCE PATTERNS
      </text>
    </g>

    <text x="48" y="420" fill="#7C776F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2">
      SELECTED, NOT EXHAUSTIVE
    </text>

    <text x="1152" y="420" fill="#7C776F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="end" letter-spacing="2">
      MORE BUILDS IN PUBLIC
    </text>
  </g>
</svg>
