<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shivesh's field notes</title>
  <desc id="desc">Editorial panels showing Shivesh's focus, learning path and technology stack.</desc>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".8" fill="#111111" fill-opacity=".07"/>
    </pattern>

    <pattern id="gridSoft" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#F5F0E6" stroke-opacity=".08"/>
    </pattern>

    <clipPath id="clip">
      <rect x="1" y="1" width="1198" height="648" rx="26"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="648" rx="26" fill="#F5F0E6" stroke="#111111" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect width="1200" height="650" fill="url(#dots)"/>

    <rect x="0" y="0" width="1200" height="86" fill="#111111"/>

    <text x="48" y="52" fill="#F5F0E6" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="900" letter-spacing="-0.4">
      THE WORKING THEORY
    </text>

    <text x="1152" y="38" fill="#C7FF2E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end" letter-spacing="2">
      02 / FIELD NOTES
    </text>

    <text x="1152" y="58" fill="#8C887F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end" letter-spacing="1.8">
      SYSTEMS / LEARNING PATH / TOOL STACK
    </text>

    <g transform="translate(48 122)">
      <rect width="694" height="208" fill="#FF5A1F" stroke="#111111" stroke-width="2"/>
      <rect width="694" height="208" fill="url(#dots)" opacity=".35"/>

      <rect x="0" y="22" width="10" height="164" fill="#C7FF2E"/>

      <text x="28" y="38" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
        WORKING HYPOTHESIS № 01
      </text>

      <text x="28" y="92" fill="#111111" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.8">
        GOOD DATA SYSTEMS
      </text>

      <text x="28" y="132" fill="#F5F0E6" font-family="Arial Black, Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.8">
        MAKE COMPLEXITY LEGIBLE.
      </text>

      <path d="M28 156H662" stroke="#111111" stroke-opacity=".18"/>

      <text x="28" y="174" fill="#2A160F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
        I’m moving from product interfaces toward the infrastructure beneath them:
      </text>

      <text x="28" y="196" fill="#2A160F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
        pipelines, databases, distributed services, cloud and observability.
      </text>
    </g>

    <g transform="translate(766 122)">
      <rect width="386" height="208" fill="#315CFF" stroke="#111111" stroke-width="2"/>
      <rect width="386" height="208" fill="url(#gridSoft)" opacity=".55"/>

      <text x="24" y="38" fill="#DDE4FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
        NOW RESEARCHING
      </text>

      <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">
        <text x="24" y="80" fill="#F5F0E6">01</text>
        <text x="60" y="80" fill="#F5F0E6">Data engineering</text>

        <path d="M24 92H340" stroke="#DDE4FF" stroke-opacity=".18"/>

        <text x="24" y="114" fill="#F5F0E6">02</text>
        <text x="60" y="114" fill="#F5F0E6">Kubernetes</text>

        <path d="M24 126H340" stroke="#DDE4FF" stroke-opacity=".18"/>

        <text x="24" y="148" fill="#F5F0E6">03</text>
        <text x="60" y="148" fill="#F5F0E6">Firewall engineering</text>

        <path d="M24 160H340" stroke="#DDE4FF" stroke-opacity=".18"/>

        <text x="24" y="182" fill="#F5F0E6">04</text>
        <text x="60" y="182" fill="#F5F0E6">Cloud architecture</text>
      </g>

      <circle cx="350" cy="52" r="11" fill="#C7FF2E">
        <animate attributeName="cy" values="52;178;52" dur="5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="350" cy="52" r="18" stroke="#C7FF2E" opacity=".25">
        <animate attributeName="cy" values="52;178;52" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;0;.25" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M48 362H1152" stroke="#111111" stroke-width="2"/>

    <text x="48" y="403" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
      THE TOOL INDEX — SELECTED, NOT EXHAUSTIVE
    </text>

    <text x="1152" y="403" fill="#5C574F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end" letter-spacing="1.8">
      LANGUAGES / APPLICATION / DATA / INFRA
    </text>

    <g transform="translate(48 432)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g>
        <rect width="250" height="148" fill="#111111"/>
        <text x="20" y="28" fill="#FF9A73" font-size="10" letter-spacing="2">LANGUAGES</text>
        <path d="M20 40H230" stroke="#F5F0E6" stroke-opacity=".12"/>
        <text x="20" y="70" fill="#F5F0E6" font-size="18">Python</text>
        <text x="20" y="100" fill="#F5F0E6" font-size="18">JavaScript / TS</text>
        <text x="20" y="130" fill="#F5F0E6" font-size="18">C++</text>
      </g>

      <g transform="translate(274)">
        <rect width="250" height="148" fill="#F5F0E6" stroke="#111111" stroke-width="2"/>
        <text x="20" y="28" fill="#FF5A1F" font-size="10" letter-spacing="2">APPLICATION</text>
        <path d="M20 40H230" stroke="#111111" stroke-opacity=".12"/>
        <text x="20" y="70" fill="#111111" font-size="18">Node + Express</text>
        <text x="20" y="100" fill="#111111" font-size="18">MongoDB / MySQL</text>
        <text x="20" y="130" fill="#111111" font-size="18">MERN</text>
      </g>

      <g transform="translate(548)">
        <rect width="250" height="148" fill="#C7FF2E" stroke="#111111" stroke-width="2"/>
        <text x="20" y="28" fill="#385000" font-size="10" letter-spacing="2">DATA + CLOUD</text>
        <path d="M20 40H230" stroke="#111111" stroke-opacity=".14"/>
        <text x="20" y="70" fill="#111111" font-size="18">AWS / Azure / GCP</text>
        <text x="20" y="100" fill="#111111" font-size="18">Pipelines + DBMS</text>
        <text x="20" y="130" fill="#111111" font-size="18">Kubernetes ↗</text>
      </g>

      <g transform="translate(822)">
        <rect width="282" height="148" fill="#FF5A1F" stroke="#111111" stroke-width="2"/>
        <text x="20" y="28" fill="#441304" font-size="10" letter-spacing="2">INFRA + SECURITY</text>
        <path d="M20 40H262" stroke="#111111" stroke-opacity=".14"/>
        <text x="20" y="70" fill="#111111" font-size="18">Cloudflare</text>
        <text x="20" y="100" fill="#111111" font-size="18">Palo Alto / Meraki</text>
        <text x="20" y="130" fill="#111111" font-size="18">Linux + networking</text>
      </g>
    </g>

    <rect x="48" y="608" width="1104" height="8" fill="#111111"/>

    <rect x="48" y="608" width="210" height="8" fill="#315CFF">
      <animate attributeName="x" values="48;942;48" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
